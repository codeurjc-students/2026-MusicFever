name: Full Quality Check

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  test:
    name: Unit, Integration & E2E Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Backend
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run unit tests (Server-Side)
        working-directory: backend/music-fever
        run: mvn -B test -Dsurefire.includes="**/unit/**/*.java"

      - name: Run integration tests (Server-Side)
        working-directory: backend/music-fever
        run: mvn -B test -Dsurefire.includes="**/integration/**/*.java"

      - name: Run E2E tests (Server-Side)
        working-directory: backend/music-fever
        run: mvn -B test -Dsurefire.includes="**/e2e/**/*.java"

      # Frontend
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests (Client-Side)
        working-directory: frontend
        run: npm run test:unit

      - name: Start backend
        working-directory: backend/music-fever
        run: nohup mvn spring-boot:run > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to start"
          cat backend/music-fever/backend.log
          exit 1

      - name: Run integration tests (Client-Side)
        working-directory: frontend
        run: npm run test:integration

      - name: Start frontend
        working-directory: frontend
        run: nohup npm start -- --host 0.0.0.0 > frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if nc -z localhost 4200; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Frontend failed to start"
          cat frontend/frontend.log
          exit 1

      - name: Run E2E tests (Client-Side)
        working-directory: frontend
        run: npx cypress run --e2e