name: Full Quality Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'CHANGELOG.md'

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: musicfever_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: MusicFever
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Set up
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Generate test keystore
        working-directory: backend/music-fever
        env:
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}
          SSL_KEY_PASSWORD: ${{ secrets.SSL_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -alias selfsigned \
            -keyalg RSA \
            -keysize 2048 \
            -storetype JKS \
            -keystore keystore.jks \
            -storepass "$SSL_KEYSTORE_PASSWORD" \
            -keypass "$SSL_KEY_PASSWORD" \
            -validity 360 \
            -dname "CN=localhost, OU=MusicFever, O=MusicFever, L=Madrid, ST=Madrid, C=ES" \
            -ext "SAN=dns:localhost,ip:127.0.0.1"

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Backend
      - name: Run backend tests + JaCoCo report
        working-directory: backend/music-fever
        run: mvn -B test jacoco:report

      # Frontend
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Start backend
        working-directory: backend/music-fever
        run: nohup mvn spring-boot:run -Dspring-boot.run.profiles=system > backend.log 2>&1 &
        env:
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}
          SSL_KEY_PASSWORD: ${{ secrets.SSL_KEY_PASSWORD }}

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if nc -z localhost 443; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to start"
          cat backend/music-fever/backend.log
          exit 1

      - name: Run frontend tests + generate coverage
        working-directory: ./frontend
        run: npm run test:coverage
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0

      # System
      - name: Start frontend
        working-directory: frontend
        run: nohup npm start -- --host 0.0.0.0 > frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if nc -z localhost 4200; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Frontend failed to start"
          cat frontend/frontend.log
          exit 1

      - name: Run system tests with Selenium
        working-directory: backend/music-fever
        run: mvn test -Dgroups=system -Dtest.excludedGroups=

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=.github/sonar/sonar-project.properties